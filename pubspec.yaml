name: grid_and_timemark
description: Aplikasi Mobile Cross-Platform Photo Grid (hingga 20 foto) & Real-time Timestamp Camera untuk kebutuhan laporan kerja.
publish_to: 'none'
version: 1.1.3+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_staggered_grid_view: ^0.7.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  gal: ^2.3.0
  image: ^4.2.0
  permission_handler: ^11.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
